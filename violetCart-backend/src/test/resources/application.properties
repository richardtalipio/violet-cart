# H2 In-Memory Datasource Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# Custom JWT Properties (Required by Security Beans during Test Context Startup)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
app.jwt.expiration-ms=86400000

# Logging Levels
logging.level.com.violetcart=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG